# fly.toml app configuration file generated for timox-server on 2026-03-16T22:19:06Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'timox-server'
primary_region = 'ams'

[build]
  [build.args]
    GO_VERSION = '1.25.0'

[env]
  PORT = '8080'
  DB_PATH = '/data/app_limits.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  max_machines_running = 1
  processes = ['app']

[[mounts]]
  source = 'timox_data'
  destination = '/data'

[[vm]]
  cpu_kind = 'shared'
  cpus = 2
  memory_mb = 256
